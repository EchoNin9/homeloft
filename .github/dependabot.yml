# Weekly dependency PRs into develop (never main). Minor/patch updates are grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/web, /site]
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Match the Node version CI and the build run on (22); bump together with node-version.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directories: [/nas/bridge, /cloud]
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directory: /nas/bridge
    target-branch: develop
    schedule: { interval: weekly, day: monday }

  # Pinned image tags in the NAS stack (floating tags like :stable are watched by wud instead).
  - package-ecosystem: docker-compose
    directory: /nas
    target-branch: develop
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

name: pages
# Builds the docs site (site/, from docs/*.md) plus the static demo (web, mock mode) and publishes
# them to GitHub Pages at homeloft.dev, with the demo at /demo/.
on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "web/**", "*.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - name: demo
        working-directory: web
        run: npm ci && npm run build:demo
      - name: docs site
        working-directory: site
        run: npm ci && npm test && npm run build && cp -r ../web/dist-demo dist/demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

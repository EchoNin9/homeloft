<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">Homeloft architecture</title>
  <desc id="d">Home Assistant and the bridge run on the NAS. The bridge connects outbound over MQTT with mutual TLS to AWS IoT Core. An ingest Lambda writes state to DynamoDB. The browser calls the API Lambda with a Cognito token; the API Lambda reads DynamoDB and publishes commands back through IoT Core.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4a55"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c7385"/></marker>
  </defs>
  <rect width="1000" height="360" rx="16" fill="#f7f9fa"/>

  <!-- groups -->
  <g fill="none" stroke="#c7d0d6" stroke-width="1.5">
    <rect x="20" y="40" width="260" height="300" rx="12"/>
    <rect x="320" y="40" width="480" height="300" rx="12"/>
    <rect x="840" y="40" width="140" height="300" rx="12"/>
  </g>
  <g fill="#5b6873" font-size="12" font-weight="600" letter-spacing=".06em">
    <text x="36" y="62">HOME · SYNOLOGY NAS</text>
    <text x="336" y="62">AWS · ONE OPENTOFU MODULE</text>
    <text x="856" y="62">YOU</text>
  </g>

  <!-- boxes -->
  <g fill="#fff" stroke="#9aa8b2" stroke-width="1.2">
    <rect x="50" y="80" width="200" height="50" rx="8"/>
    <rect x="345" y="80" width="125" height="50" rx="8"/>
    <rect x="500" y="80" width="125" height="50" rx="8"/>
    <rect x="655" y="80" width="125" height="50" rx="8"/>
    <rect x="345" y="180" width="125" height="50" rx="8"/>
    <rect x="500" y="180" width="125" height="50" rx="8"/>
    <rect x="500" y="270" width="125" height="50" rx="8"/>
    <rect x="655" y="270" width="125" height="50" rx="8"/>
    <rect x="855" y="180" width="110" height="50" rx="8"/>
    <rect x="50" y="270" width="200" height="50" rx="8" stroke-dasharray="4 3"/>
  </g>
  <rect x="50" y="180" width="200" height="50" rx="8" fill="#0c7385"/>

  <g fill="#1d262d" text-anchor="middle">
    <text x="150" y="110">Home Assistant</text>
    <text x="150" y="210" fill="#fff" font-weight="600">bridge</text>
    <text x="150" y="291" font-size="12" fill="#5b6873">Mosquitto · Zigbee2MQTT</text>
    <text x="150" y="307" font-size="12" fill="#5b6873">AdGuard · WUD · backup</text>
    <text x="407" y="110">ingest λ</text>
    <text x="562" y="110">DynamoDB</text>
    <text x="717" y="110">rollup λ</text>
    <text x="407" y="210">IoT Core</text>
    <text x="562" y="210">API + api λ</text>
    <text x="562" y="300">Cognito</text>
    <text x="717" y="292">CloudFront</text>
    <text x="717" y="308" font-size="12" fill="#5b6873">dashboard</text>
    <text x="910" y="202">Browser</text>
    <text x="910" y="218" font-size="12" fill="#5b6873">or your app</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#3d4a55" stroke-width="1.5">
    <path d="M150 132V178" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M407 180V132" marker-end="url(#a)"/>
    <path d="M470 105H498" marker-end="url(#a)"/>
    <path d="M655 105H627" marker-end="url(#a)"/>
    <path d="M562 180V132" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M500 205H472" marker-end="url(#a)"/>
    <path d="M855 205H627" marker-end="url(#a)"/>
    <path d="M562 232V268" stroke-dasharray="4 3"/>
    <path d="M910 232V295H782" marker-end="url(#a)"/>
  </g>
  <path d="M252 205H343" fill="none" stroke="#0c7385" stroke-width="3.5" marker-start="url(#at)" marker-end="url(#at)"/>

  <g fill="#3d4a55" font-size="11.5">
    <text x="160" y="160">WebSocket, loopback</text>
    <text x="413" y="160">rule</text>
    <text x="474" y="198" font-size="11">cmd</text>
    <text x="740" y="198" text-anchor="middle">HTTPS + JWT</text>
    <text x="570" y="254">JWT check</text>
  </g>
  <g fill="#0c7385" font-size="11.5" font-weight="600" text-anchor="middle">
    <text x="298" y="232">MQTT/TLS</text>
    <text x="298" y="247">X.509</text>
    <text x="298" y="262">outbound only</text>
  </g>
</svg>
